services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sorteos_test
      POSTGRES_USER: demo_test
      POSTGRES_PASSWORD: demo_local_only
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_test -d sorteos_test"]
      interval: 2s
      timeout: 3s
      retries: 15
